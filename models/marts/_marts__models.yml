version: 2

models:
  - name: dim_users
    description: User dimension for analytics
    columns:
      - name: user_id
        tests:
          - unique
          - not_null

  - name: fct_events
    description: Incremental fact table of product events
    columns:
      - name: event_id
        tests:
          - unique
          - not_null
      - name: user_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_users')
                field: user_id

  - name: agg_daily_metrics
    description: Daily rollups of event activity
    columns:
      - name: event_date
        tests:
          - unique
          - not_null
