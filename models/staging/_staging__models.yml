version: 2

models:
  - name: stg_events
    description: Cleaned and standardized raw events
    columns:
      - name: event_id
        tests:
          - not_null
      - name: user_id
        tests:
          - not_null
      - name: event_name
        tests:
          - not_null
      - name: event_timestamp
        tests:
          - not_null

  - name: stg_users
    description: Cleaned and standardized raw users
    columns:
      - name: user_id
        tests:
          - unique
          - not_null
      - name: email
        tests:
          - not_null
