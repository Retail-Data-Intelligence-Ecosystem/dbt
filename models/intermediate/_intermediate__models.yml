version: 2

models:
  - name: int_events_deduped
    description: Deduplicated events ready for fact modeling
    columns:
      - name: event_id
        tests:
          - unique
          - not_null

  - name: int_user_sessions
    description: Sessionized user activity with 30-minute inactivity timeout
    columns:
      - name: session_key
        tests:
          - unique
          - not_null
      - name: user_id
        tests:
          - not_null
