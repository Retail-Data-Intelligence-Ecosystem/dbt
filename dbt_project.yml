name: 'learning'
version: '1.0.0'
config-version: 2

profile: 'databricks_free'

model-paths: ['models']
analysis-paths: ['analyses']
test-paths: ['tests']
seed-paths: ['seeds']
macro-paths: ['macros']
snapshot-paths: ['snapshots']

target-path: 'target'
clean-targets:
  - 'target'
  - 'dbt_packages'

# Catalog and default schema come from profiles.yml (dbt / dbt_sch).
# Use vars in sources and models when you need other locations.
vars:
  catalog: "{{ env_var('DBT_DATABRICKS_CATALOG', 'dbt') }}"
  default_schema: "{{ env_var('DBT_DATABRICKS_SCHEMA', 'dbt_sch') }}"

models:
  learning:
    +materialized: view
    +file_format: delta

    staging:
      +tags: ['staging']

    intermediate:
      +materialized: table
      +tags: ['intermediate']

    marts:
      +materialized: table
      +tags: ['marts']

seeds:
  learning:
    +file_format: delta

snapshots:
  learning:
    +file_format: delta
